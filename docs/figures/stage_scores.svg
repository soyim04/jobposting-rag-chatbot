<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 560' width='900' height='560' role='img' aria-label='단계별 답변 정확도(v2 → v4)와 최신성' font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>단계별 답변 정확도(v2 → v4)와 최신성</title><desc>전략 B의 0~6단계와 top_k=10 최종의 답변 정확도를 정답지 수정 전(v2)과 후(v4)로 비교하고, 최신성을 따로 보여 준다</desc><rect width='900' height='560' fill='white'/><text x='40' y='34' font-size='18' fill='#1f2937' text-anchor='start' font-weight='bold'>정답지를 고친 뒤(v4)에도 답변 정확도는 72%에서 93%로 오르고, 최신성은 83%에서 100%가 됐다</text><line x1='40' x2='64' y1='64' y2='64' stroke='#2563eb' stroke-width='3'/><circle cx='52' cy='64' r='5' fill='#2563eb'/><text x='72' y='69' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal'>답변 정확도 v4 (정답지 수정 후)</text><line x1='290' x2='314' y1='64' y2='64' stroke='#9ca3af' stroke-width='2.5' stroke-dasharray='6 4'/><circle cx='302' cy='64' r='4' fill='#9ca3af'/><text x='322' y='69' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal'>v2 (수정 전)</text><circle cx='428' cy='64' r='4' fill='white' stroke='#2563eb' stroke-width='2'/><text x='440' y='69' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal'>같은 설정 2회의 각 실행(평균은 채운 점)</text><text x='40' y='98' font-size='13' fill='#1f2937' text-anchor='start' font-weight='bold'>최신성 (정답지 수정과 무관해 v2와 v4가 같다)</text><line x1='60' x2='820' y1='170.0' y2='170.0' stroke='#e5e7eb'/><text x='54' y='174.0' font-size='11' fill='#6b7280' text-anchor='end' font-weight='normal'>80%</text><line x1='60' x2='820' y1='120.0' y2='120.0' stroke='#e5e7eb'/><text x='54' y='124.0' font-size='11' fill='#6b7280' text-anchor='end' font-weight='normal'>100%</text><polyline points='90,161.66666666666663 190,161.66666666666663 290,161.66666666666663 390,120.0 490,120.0 590,120.0 690,120.0 790,120.0' fill='none' stroke='#9ca3af' stroke-width='2.5'/><circle cx='90' cy='161.66666666666663' r='4' fill='#9ca3af'><title>0 기준선 · 최신성 83.3%</title></circle><circle cx='190' cy='16