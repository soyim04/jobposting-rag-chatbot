='normal'>기준선</text><text x='190' y='333.0' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>78.0%</text><text x='190' y='407.0' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>70.0%</text><text x='190' y='459' font-size='14' fill='#1f2937' text-anchor='middle' font-weight='bold'>1</text><text x='190' y='477' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>공고 전체 투입</text><text x='290' y='343.0' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>76.0%</text><text x='290' y='377.0' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>76.0%</text><text x='290' y='459' font-size='14' fill='#1f2937' text-anchor='middle' font-weight='bold'>2</text><text x='290' y='477' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>기술 동의어</text><text x='390' y='293.0' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>86.0%</text><text x='390' y='347.0' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>82.0%</text><text x='390' y='459' font-size='14' fill='#1f2937' text-anchor='middle' font-weight='bold'>3</text><text x='390' y='477' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>조건 코드 필터</text><text x='490' y='283.0' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>88.0%</text><text x='490' y='347.0' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>82.0%</text><text x='490' y='459' font-size='14' fill='#1f2937' text-anchor='middle' font-weight='bold'>4</text><text x='490' y='477' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>분류-본문 차이</text><text x='590' y='263.0' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>92.0%</text><text x='590' y='357.0' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>84.0%</text><text x='590' y='459' font-size='14' fill='#1f2937' text-anchor='middle' font-weight='bold'>5</text><text x='590' y='477' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>지시문 v2</text><text x='690' y='243.0' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>93.0%</text><text x='690' y='337.0' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>85.0%</text><text x='690' y='459' font-size='14' fill='#1f2937' text-anchor='middle' font-weight='bold'>6</text><text x='690' y='477' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>공고별 균등 검색</text><text x='790' y='243.0' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>93.0%</text><text x='790' y='347.0' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>84.0%</text><text x='790' y='459' font-size='14' fill='#1f2937' text-anchor='middle' font-weight='bold'>k10</text><text x='790' y='477' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>top_k=10 최종</text><text x='40' y='520' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal'>전략 B. 정답지 수정(v4)은 A03·A04·A09·A14를 질문만 보고 고친 것이고, 15개 원본 답변을 기준선부터 모두 다시 채점했다. 세로축은 60%부터.</text><text x='40' y='538' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal'>5·6단계와 k10은 같은 설정 2회 실행의 평균이다. 수정하지 않은 문항도 재채점으로 −4~+6%p 흔들려, 단계별 증감을 개선 효과로 단정하지 않는다.</text><text x='40' y='556' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal'>회색 점선 아래 숫자는 v2(수정 전), 파란 선 위 숫자는 v4(수정 후). k10은 top_k=10 최종 설정이라 6단계와 선을 잇지 않았다.</text></svg>