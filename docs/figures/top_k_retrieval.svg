<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 400' width='760' height='400' role='img' aria-label='top_k별 검색 적중률' font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>top_k별 검색 적중률</title><desc>top_k 3, 5, 10, 20에서 질문 그대로와 동의어 확장의 검색 적중률</desc><rect width='760' height='400' fill='white'/><text x='40' y='34' font-size='18' fill='#1f2937' text-anchor='start' font-weight='bold'>top_k를 5에서 10으로 올리면 순수 검색 적중률이 76%에서 92%로 오른다</text><line x1='40' x2='64' y1='64' y2='64' stroke='#2563eb' stroke-width='3'/><circle cx='52' cy='64' r='5' fill='#2563eb'/><text x='72' y='69' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal'>질문 그대로 (1차 기준선 설정)</text><line x1='310' x2='334' y1='64' y2='64' stroke='#9ca3af' stroke-width='3'/><circle cx='322' cy='64' r='4' fill='#9ca3af'/><text x='342' y='69' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal'>동의어 확장 (2단계 설정)</text><line x1='70' x2='660' y1='300' y2='300' stroke='#9ca3af'/><line x1='280' x2='280' y1='90' y2='300' stroke='#e5e7eb' stroke-dasharray='4 4'/><text x='286' y='98' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal'>현재 기본값 k=5</text><polyline points='110,228.0 280,180.0 450,132.0 620,116.0' fill='none' stroke='#9ca3af' stroke-width='2.5'/><circle cx='110' cy='228.0' r='4' fill='#9ca3af'><title>동의어 확장 · k=3: 68.0%</title></circle><circle cx='280' cy='180.0' r='4' fill='#9ca3af'><title>동의어 확장 · k=5: 80.0%</title></circle><circle cx='450' cy='132.0' r='4' fill='#9ca3af'><title>동의어 확장 · k=10: 92.0%</title></circle><circle cx='620' cy='116.0' r='4' fill='#9ca3af'><title>동의어 확장 · k=20: 96.0%</title></circle><polyline points='110,228.0 280,196.0 450,132.0 620,116.0' fill='none' stroke='#2563eb' stroke-width='3'/><circle cx='110' cy='228.0' r='5' fill='#2563eb'><title>질문 그대로 · k=3: 68.0%</title></circle><circle cx='280' cy='196.0' r='5' fill='#2563eb'><title>질문 그대로 · k=5: 76.0%</title></circle><circle cx='450' cy='132.0' r='5' fill='#2563eb'><title>질문 그대로 · k=10: 92.0%</title></circle><circle cx='620' cy='116.0' r='5' fill='#2563eb'><title>질문 그대로 · k=20: 96.0%</title></circle><text x='110' y='250.0' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>68%</text><text x='110' y='324' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='normal'>k=3</text><text x='280' y='218.0' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>76%</text><text x='280' y='324' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='normal'>k=5</text><text x='450' y='154.0' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>92%</text><text x='450' y='324' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='normal'>k=10</text><text x='620' y='138.0' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>96%</text><text x='620' y='324' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='normal'>k=20</text><text x='280' y='168.0' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>80% (동의어)</text><text x='40' y='372' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal'>전략 B, 정답 근거가 있는 25문항. 질문을 임베딩해 정답 근거 청크가 상위 k개에 하나라도 있으면 적중. 세로축은 50%부터.</text><text x='40' y='390' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal'>같은 설정으로 답변까지 평가하면(2회) 답변 정확도 66.0% → 78.0% / 68.0% (평균 73.0%). 파이프라인 전체에서는 차이가 없다.</text></svg>