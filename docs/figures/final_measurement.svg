<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 500' width='1000' height='500' role='img' aria-label='최종 측정: 답변 정확도 비교' font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>최종 측정: 답변 정확도 비교</title><desc>GPT 빈손, 고치기 전, 고친 후 개발 문항(2회 평균), 고친 후 홀드아웃의 답변 정확도 막대 그래프</desc><rect width='1000' height='500' fill='white'/><text x='40' y='34' font-size='18' fill='#1f2937' text-anchor='start' font-weight='bold'>답변 정확도: 12% → 72% → 94–96%, 새 문항(홀드아웃)에서도 88.5%</text><text x='40' y='60' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal'>채점 기준 v4, 정답 1 · 부분 0.5 · 오답 0의 평균. 고친 후 개발 문항의 흰 점은 같은 설정 2회의 각 실행(a, b)</text><line x1='80' x2='960' y1='380.0' y2='380.0' stroke='#e5e7eb'/><text x='72' y='384.0' font-size='11' fill='#6b7280' text-anchor='end' font-weight='normal'>0%</text><line x1='80' x2='960' y1='326.0' y2='326.0' stroke='#e5e7eb'/><text x='72' y='330.0' font-size='11' fill='#6b7280' text-anchor='end' font-weight='normal'>20%</text><line x1='80' x2='960' y1='272.0' y2='272.0' stroke='#e5e7eb'/><text x='72' y='276.0' font-size='11' fill='#6b7280' text-anchor='end' font-weight='normal'>40%</text><line x1='80' x2='960' y1='218.0' y2='218.0' stroke='#e5e7eb'/><text x='72' y='222.0' font-size='11' fill='#6b7280' text-anchor='end' font-weight='normal'>60%</text><line x1='80' x2='960' y1='164.0' y2='164.0' stroke='#e5e7eb'/><text x='72' y='168.0' font-size='11' fill='#6b7280' text-anchor='end' font-weight='normal'>80%</text><line x1='80' x2='960' y1='110.0' y2='110.0' stroke='#e5e7eb'/><text x='72' y='114.0' font-size='11' fill='#6b7280' text-anchor='end' font-weight='normal'>100%</text><line x1='80' x2='960' y1='380' y2='380' stroke='#9ca3af'/><rect x='105.0' y='347.6' width='90' height='32.39999999999998' fill='#9ca3af'><title>GPT 빈손 · 12.0% (정답 2 · 부분 2 · 오답 21)</title></rect><text x='150' y='339.6' font-size='14' fill='#1f2937' text-anchor='middle' font-weight='bold' stroke='white' stroke-width='4' paint-order='stroke' stroke-linejoin='round'>12.0%</text><text x='150' y='404' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>GPT 빈손</text><text x='150' y='424' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>정답 2 · 부분 2 · 오답 21</text><rect x='315.0' y='185.6' width='90' height='194.4' fill='#93c5fd'><title>고치기 전 · 72.0% (정답 15 · 부분 6 · 오답 4)</title></rect><text x='360' y='177.6' font-size='14' fill='#1f2937' text-anchor='middle' font-weight='bold' stroke='white' stroke-width='4' paint-order='stroke' stroke-linejoin='round'>72.0%</text><text x='360' y='404' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>고치기 전</text><text x='360' y='424' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>정답 15 · 부분 6 · 오답 4</text><rect x='585.0' y='123.5' width='90' height='256.5' fill='#2563eb'><title>고친 후 (개발 문항) · 평균 95.0% (a 94.0% · b 96.0%)</title></rect><circle cx='614' cy='126.20000000000002' r='5' fill='white' stroke='#2563eb' stroke-width='2'><title>a: 94.0%</title></circle><circle cx='646' cy='120.80000000000001' r='5' fill='white' stroke='#2563eb' stroke-width='2'><title>b: 96.0%</title></circle><text x='630' y='96.80000000000001' font-size='14' fill='#1f2937' text-anchor='middle' font-weight='bold' stroke='white' stroke-width='4' paint-order='stroke' stroke-linejoin='round'>평균 95.0%</text><text x='630' y='111.80000000000001' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' stroke='white' stroke-width='4' paint-order='stroke' stroke-linejoin='round'>(a 94.0 · b 96.0)</text><text x='630' y='404' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>고친 후 (개발 문항)</text><text x='630' y='424' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>a: 정답 22 · 부분 3 · 오답 0</text><text x='630' y='440' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>b: 정답 23 · 부분 2 · 오답 0</text><rect x='825.0' y='141.15384615384616' width='90' height='238.84615384615384' fill='#0f766e'><title>고친 후 (새 문항, 홀드아웃) · 88.5% (정답 11 · 부분 1 · 오답 1)</title></rect><text x='870' y='133.15384615384616' font-size='14' fill='#1f2937' text-anchor='middle' font-weight='bold' stroke='white' stroke-width='4' paint-order='stroke' stroke-linejoin='round'>88.5%</text><text x='870' y='404' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>고친 후 (새 문항, 홀드아웃)</text><text x='870' y='424' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>정답 11 · 부분 1 · 오답 1</text><text x='255' y='177.6' font-size='13' fill='#2563eb' text-anchor='middle' font-weight='bold' stroke='white' stroke-width='4' paint-order='stroke' stroke-linejoin='round'>+60%p</text><text x='495' y='115.5' font-size='13' fill='#2563eb' text-anchor='middle' font-weight='bold' stroke='white' stroke-width='4' paint-order='stroke' stroke-linejoin='round'>+22–24%p</text><text x='40' y='468' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal'>개발 문항은 정답형·함정 25개이고, 고친 후 막대는 같은 설정 2회(a, b)의 평균이다. 홀드아웃은 코드 동결 뒤 새로 쓴 문항을 1회만 측정했다.</text><text x='40' y='488' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal'>홀드아웃은 채점 대상이 13개라 한 문항이 7.7%p를 움직인다. 개발 문항과의 차이는 한 문항 안팎이라 크기를 확정하지 않는다.</text></svg>